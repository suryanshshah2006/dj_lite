next:
  default_n: 10
  default_alpha: 0.5
  max_n: 50

mix:
  generator: beam_v1       # or greedy_v0 (also selectable per request: {"generator": ...})
  default_length: 12
  max_length: 40
  default_alpha: 0.5       # "DJ mode"; the UI's "Discovery mode" sends 0.75
  # gamma (arc weight), beam width, pool size and constraints: configs/generator.yaml

covers:
  db_path: app/backend/cache/covers.sqlite   # relative to the project root
  requests_per_second: 5
  timeout_s: 6
  failure_ttl_hours: 24    # transient failures (network/5xx) are retried after this
  # "not found" (4xx / no thumbnail) is cached permanently

reports:
  eval_csv_v2: reports/eval_v2.csv
  eval_csv_v1: reports/eval_step3.csv
  figures_dir: reports/figures
