# DJ-Lite web backend settings (the djlite pipeline configs in configs/ are read, not changed).
cors_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]

search:
  limit: 20
  db_path: app/backend/cache/search.sqlite   # FTS5 index; rebuild: python -m app.backend.build_search_index
  tier_cap: 400            # max rows read per ranking tier (keeps common queries fast)
  # Tie-break within a tier by the primary artist's prominence (precomputed in the index):
  #   co_artists: distinct artists sharing an album with them (originals > cover/tribute acts)
  #   tracks:     number of tracks by the artist (favours prolific cover acts, e.g.
  #               Vitamin String Quartet outranks Queen on "bohemian rhapsody")
  prominence: co_artists
  tier_window: 5000        # prominence ordering looks at the first N matches per tier (exact below N)
  # Same title within a tier: the earliest release by an artist with prominence >= N goes first
  # (null = off). 100 is the only tested threshold (10/20/30/50/100) that improved the
  # 20-song regression set (11 -> 12 of 20) without breaking a pass; lower ones fix more
  # songs but break "Halo". Chosen on that same set, so treat the gain as weak evidence.
  original_boost_min_prominence: 100

